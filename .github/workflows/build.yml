name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core and build the APK
        run: ./gradlew :core:test :app:assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk treadmill.apk
      - uses: actions/upload-artifact@v4
        with:
          name: treadmill-apk
          path: treadmill.apk
      # Every build of main becomes a release, so the newest APK is always at
      # releases/latest/download/treadmill.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)-$RUN"
          gh release create "$TAG" treadmill.apk --target "$GITHUB_SHA" --latest \
            --title "Treadmill $TAG" --notes "Install treadmill.apk on the console. See docs/INSTALL.md."
